# Mapeamentos de scripts de build e sobrescritas de propriedades por arquivo.
# Utilizados pelo zAppBuild para determinar qual script Groovy processa cada fonte.

#
# Mapeamentos de linguagem → script de build
dbb.scriptMapping = Assembler.groovy :: **/*.asm,*.asm
dbb.scriptMapping = BMS.groovy :: **/*.bms,*.bms
dbb.scriptMapping = Cobol.groovy :: **/*.cbl,*.cbl
dbb.scriptMapping = LinkEdit.groovy :: **/*.lnk,*.lnk
dbb.scriptMapping = PLI.groovy :: **/*.pli,*.pli
dbb.scriptMapping = REXX.groovy :: **/*.rexx,*.rexx,**/REXX/*

#
# ── COBOL ─────────────────────────────────────────────────────────────────────
# SAM2 deve ser compilado antes de SAM1 (SAM1 chama SAM2 estaticamente)
cobol_fileBuildRank = 1 :: **/COBOL/SAM2.cbl

# Mapeamento de nomes de bibliotecas alternativos para COBOL
cobol_dependenciesAlternativeLibraryNameMapping = {"MYFILE": "cobol_cpyPDS", "MYLIB" : "cobol_cpyPDS"}

#
# ── PL/I ──────────────────────────────────────────────────────────────────────
# PSAM2 deve ser compilado antes de PSAM1 e PSAM1LIB
pli_fileBuildRank = 1 :: **/PLI/PSAM2.pli

# PSAM2 não gera load module próprio — é linkado estaticamente em PSAM1
pli_linkEdit = false :: **/PLI/PSAM2.pli

# Mapeamento de nomes de bibliotecas alternativos para PL/I
pli_dependenciesAlternativeLibraryNameMapping = {"MYFILE": "pli_incPDS", "MYLIB" : "pli_incPDS"}

#
# ── ASSEMBLER ─────────────────────────────────────────────────────────────────
# ASAM1 e MASAM1 são programas independentes — sem fileBuildRank especial
# assembler_fileBuildRank = 1 :: **/ASM/ASAM1.asm

#
# ── REXX ──────────────────────────────────────────────────────────────────────
# Scripts REXX são copiados como EXEC (não compilados por padrão)
# Para ativar compilação REXX, descomente a linha abaixo:
# rexx_compile = true :: **/REXX/RSAM1.rexx,**/REXX/FIB.rexx

# Tipo de deploy para scripts REXX: CLIST (execução via ISPF/JCL)
rexx_deployType = CLIST :: **/REXX/*.rexx
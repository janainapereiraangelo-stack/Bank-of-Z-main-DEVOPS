#
# build.properties — Arquivo principal de configuração do IBM Dependency Based Build (DBB)
# para o repositório zopeneditor-sample-wazi.
#
# Ajuste os valores abaixo conforme o seu ambiente z/OS antes de executar qualquer build.
###############################################################################

# =============================================================================
# CONFIGURAÇÕES GERAIS DO AMBIENTE
# =============================================================================

# High Level Qualifier (HLQ) — prefixo de dataset no z/OS.
hlq=RAFAELT

# Nome da aplicação — usado como identificador nos datasets e logs.
application=zopeneditor-sample

# Diretório raiz do workspace no USS (z/OS UNIX System Services).
workspace=/u/rafaelt/projects

# Diretório completo da aplicação no USS (montado automaticamente).
applicationDir=${workspace}/${application}

# Diretório de saída dos logs de build.
outDir=${applicationDir}/logs

# Branch principal do repositório Git.
mainBuildBranch=main

# =============================================================================
# DATASETS DE ORIGEM (FONTES NO z/OS)
# =============================================================================

# PDS de fonte COBOL
cobol_srcPDS=${hlq}.SAMPLE.COBOL

# PDS de copybooks COBOL
cobol_cpyPDS=${hlq}.SAMPLE.COPY

# PDS de fonte PL/I
pli_srcPDS=${hlq}.SAMPLE.PLI

# PDS de includes PL/I
pli_incPDS=${hlq}.SAMPLE.PLINC

# PDS de fonte Assembler
asm_srcPDS=${hlq}.SAMPLE.ASM

# PDS de macros Assembler
asm_macPDS=${hlq}.SAMPLE.MACLIB

# PDS de fonte REXX
rexx_srcPDS=${hlq}.SAMPLE.REXX

# =============================================================================
# DATASETS DE SAÍDA (OBJETOS E LOAD MODULES)
# =============================================================================

# PDS de objetos (output de compilação — todos os tipos)
objPDS=${hlq}.SAMPLE.OBJ

# PDS de load modules (executáveis linkados)
loadPDS=${hlq}.SAMPLE.LOAD

# PDS de load modules CICS
cicsLoadPDS=${hlq}.SAMPLE.CICSLOAD

# =============================================================================
# BIBLIOTECAS DE SISTEMA (COMPILADORES E FERRAMENTAS)
# =============================================================================

# Biblioteca do compilador COBOL (Enterprise COBOL V6)
# Ajuste para a versão disponível no seu sistema
SIGYCOMP_V6=IGY630.SIGYCOMP

# Biblioteca do compilador COBOL V4 (legado)
SIGYCOMP_V4=IGY630.SIGYCOMP

# Biblioteca do compilador PL/I V6.1
IBMZPLI_V61=IEL610.SIBMZCMP

# Biblioteca do montador HLASM
SASMMOD1=HLA.SASMMOD1

# Biblioteca Language Environment (link-edit)
SCEELKED=CEE.SCEELKED
SCEEMAC=CEE.SCEEMAC

# Biblioteca de macros do sistema
MACLIB=SYS1.MACLIB

# Biblioteca CICS
SDFHMAC=DFH560.CICS.SDFHMAC
SDFHLOAD=DFH560.CICS.SDFHLOAD
SDFHCOB=DFH560.CICS.SDFHCOB

# Biblioteca MQ
SCSQCOBC=CSQ920.SCSQCOBC
SCSQLOAD=CSQ920.SCSQLOAD

# Biblioteca DB2
SDSNLOAD=DSNC10.SDSNLOAD

# Biblioteca IMS
SDFSMAC=DFSF10.SDFSMAC
SDFSRESL=DFSF10.SDFSRESL

# Biblioteca IBM Debug
SEQAMOD=EQAF00.SEQAMOD

# =============================================================================
# OPÇÕES DE ALOCAÇÃO DOS DATASETS
# =============================================================================

# Opções padrão para datasets de fonte/objeto (FB LRECL=80)
dsOptions=cyl space(100,10) lrecl(80) dsorg(PO) recfm(F,B) blksize(32720) dsntype(library) msg(1) new

# Opções para datasets de load module (U, sem LRECL)
loadDsOptions=cyl space(100,10) dsorg(PO) recfm(U) blksize(32720) dsntype(library) msg(1) new

# =============================================================================
# OPÇÕES DE COMPILAÇÃO — COBOL
# =============================================================================
cobol_compileParms=LIB,MAP,NODYN
cobol_compilerVersion=V6
cobol_compileMaxRC=4
cobol_linkEditParms=MAP,RENT,COMPAT(PM5)
cobol_linkEditMaxRC=4
cobol_linkEdit=true
cobol_deployType=LOAD
cobol_storeSSI=true

# =============================================================================
# OPÇÕES DE COMPILAÇÃO — PL/I
# =============================================================================
pli_compileParms=PP(INCLUDE('ID(++INCLUDE)'))
pli_compilerVersion=V61
pli_compileMaxRC=4
pli_linkEditParms=MAP,RENT,COMPAT(PM5)
pli_linkEditMaxRC=0
pli_linkEdit=true
pli_deployType=LOAD
pli_storeSSI=true

# =============================================================================
# OPÇÕES DE COMPILAÇÃO — ASSEMBLER (HLASM)
# =============================================================================
assembler_pgmParms=LIST,OBJECT
assembler_linkEditParms=MAP,RENT,COMPAT(PM5)
assembler_maxRC=4
assembler_linkEditMaxRC=0
assembler_linkEdit=true
assembler_deployType=LOAD
assembler_storeSSI=true

# =============================================================================
# OPÇÕES DE COMPILAÇÃO — REXX
# =============================================================================
rexx_compileParms=OBJECT PRINT XREF CEXEC
rexx_compileMaxRC=4
rexx_linkEditMaxRC=4
rexx_linkEdit=true
rexx_deployType=CLIST
rexx_storeSSI=true
